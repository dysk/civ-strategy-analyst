# /etc/nginx/sites-available/civ-strategy-analyst
#
# Deploy order matters here:
#   1. symlink this file into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
#   2. sudo certbot --nginx -d civ-analyst.duckdns.org
#      certbot rewrites this file in place: adds the ssl_certificate directives,
#      a `listen 443 ssl` server block, and a 301 redirect from this http block.
#      From then on, `certbot renew` keeps it updated — don't hand-edit the
#      cert paths back in.

upstream civ_strategy_analyst {
  server unix:/run/civ-strategy-analyst/puma.sock fail_timeout=0;
}

server {
  listen 80;
  listen [::]:80;
  server_name civ-analyst.duckdns.org;

  root /home/deploy/civ-strategy-analyst/public;

  location ~ ^/(assets)/ {
    expires max;
    add_header Cache-Control public;
  }

  try_files $uri @app;

  location @app {
    proxy_pass http://civ_strategy_analyst;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  client_max_body_size 10m;
}
